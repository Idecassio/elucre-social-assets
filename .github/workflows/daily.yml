name: eLucre · daily preview
# Posta a prévia no Discord + enfileira o post do dia.
# DISPARO: agendado pelo n8n — workflow "eLucre · disparador (cron externo)" (~08:35 BRT) chama via
# workflow_dispatch. O cron do GitHub Actions era "best-effort" (atrasava horas e às vezes sumia),
# então foi removido daqui; o n8n é o agendador confiável.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar deps
        working-directory: _publisher
        run: npm ci
      - name: Prévia + enfileirar
        working-directory: _publisher
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: v21.0
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/elucre/daily.mjs
      - name: Commitar estado
        run: |
          git config user.name "eLucre bot"
          git config user.email "bot@users.noreply.github.com"
          git add _publisher/content/ledger.json _social/dashboard_data.js 2>/dev/null || true
          git commit -m "chore(daily): estado $(date -u +%FT%TZ)" || echo "sem mudancas"
          git pull --rebase --autostash || true
          git push
