name: eLucre · publish
# Todo dia útil 13:00 BRT (16:00 UTC): publica feed+story dos itens vencidos e não vetados.
# 2 horários (16:00 e 16:20 UTC) por resiliência — o 2º pula o que já publicou (idempotente).
on:
  schedule:
    - cron: '0 16 * * 1-5'
    - cron: '20 16 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        working-directory: _publisher
        run: npm ci
      - name: Publicar vencidos
        working-directory: _publisher
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: v21.0
          IMAGE_HOST: github
          ASSETS_GITHUB_REPO: Idecassio/elucre-social-assets
          ASSETS_GITHUB_TOKEN: ${{ secrets.ASSETS_GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/run-due.mjs
      - name: Commitar estado
        run: |
          git config user.name "eLucre bot"
          git config user.email "bot@users.noreply.github.com"
          git add _publisher/content/ledger.json _social/dashboard_data.js _social/vetos.json 2>/dev/null || true
          git commit -m "chore(publish): estado $(date -u +%FT%TZ)" || echo "sem mudancas"
          git pull --rebase --autostash || true
          git push
