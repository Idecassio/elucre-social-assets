name: eLucre · publish
# Todo dia útil ~13:08 BRT (16:08 UTC): publica feed+story dos itens vencidos e não vetados.
# 2 horários em minuto quebrado (16:08 e 16:28 UTC) — fogem da fila de hora cheia do GitHub;
# o 2º pula o que já publicou (idempotente). Janela de veto 08:35 → 13:08.
on:
  schedule:
    - cron: '8 16 * * 1-5'
    - cron: '28 16 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Publicar uma data específica AGORA (YYYY-MM-DD). Vazio = só a fila normal.'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar deps
        working-directory: _publisher
        run: npm ci
      - name: Publicar vencidos
        working-directory: _publisher
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: v21.0
          IMAGE_HOST: github
          ASSETS_GITHUB_REPO: Idecassio/elucre-social-assets
          # Mesmo repo do código → o token embutido do Actions (contents:write) já sobe as imagens.
          ASSETS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then node scripts/elucre/publish-now.mjs --date "${{ github.event.inputs.date }}"; fi
          node scripts/run-due.mjs
      - name: Commitar estado
        run: |
          git config user.name "eLucre bot"
          git config user.email "bot@users.noreply.github.com"
          git add _publisher/content/ledger.json _social/dashboard_data.js _social/vetos.json 2>/dev/null || true
          git commit -m "chore(publish): estado $(date -u +%FT%TZ)" || echo "sem mudancas"
          git pull --rebase --autostash || true
          git push
