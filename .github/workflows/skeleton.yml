name: eLucre · skeleton (dia 1)
# Dia 1 de cada mês, 08:05 BRT (11:05 UTC): cria o esqueleto do calendário do mês e avisa no Discord.
# Depois, o Claude preenche os temas/legendas e sobe os assets (feed+story) por push.
on:
  schedule:
    - cron: '5 11 1 * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  skeleton:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar deps
        working-directory: _publisher
        run: npm ci
      - name: Criar esqueleto do mês
        working-directory: _publisher
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/elucre/skeleton.mjs
      - name: Commitar calendário
        run: |
          git config user.name "eLucre bot"
          git config user.email "bot@users.noreply.github.com"
          git add _social/calendario_*.json 2>/dev/null || true
          git commit -m "chore(skeleton): calendario do mes" || echo "sem mudancas"
          git pull --rebase --autostash || true
          git push
